version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: chore
      include: scope
    # agenthood is exact-pinned and its upgrade is blocked by agenthood#739
    # (the package exports map dropped ./dist/llm and ./dist/core). Surface a
    # failing bump PR never merges is noise — upgrades are applied manually per
    # issue #176, so Dependabot ignores it.
    ignore:
      dependency-name:
        - agenthood
    groups:
      prod-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
