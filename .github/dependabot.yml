version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # agenthood is exact-pinned and its upgrade is blocked by agenthood#739,
      # so surface every bump on its own PR flagged breaking-suspect.
      agenthood:
        patterns:
          - agenthood
        labels:
          - dependencies
          - agenthood
          - breaking-suspect
      prod-dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - agenthood
        update-types:
          - minor
          - patch
        labels:
          - dependencies
          - javascript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
