name: News Digest

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate news digest
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          OUTPUT=$(node scripts/generate-news-digest.mjs)
          echo "::notice::$OUTPUT"
          echo "result=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: startsWith(steps.generate.outputs.result, 'WROTE')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          POST=$(echo "${{ steps.generate.outputs.result }}" | sed 's/^WROTE content\/news\///')
          SLUG=$(basename "$POST" .md)                # whats-new-2026-08-08
          DATE=${SLUG##whats-new-}                    # 2026-08-08
          BRANCH="news-digest/$DATE"

          if gh pr view "$BRANCH" --json number -q .number >/dev/null 2>&1; then
            echo "::notice::PR for $DATE already exists"
            exit 0
          fi

          git config user.name "agenthood-bot"
          git config user.email "agenthood-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add content/news
          git commit -m "content(news): digest for $DATE"
          git push -u origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "News digest: $DATE" \
            --body "Automated digest of Agenthood releases not yet reported on the /news page. Please review the draft before merging — titles, summaries, and tone are generated by an LLM and may need a human pass." \
            --label automation

          echo "::notice::Opened PR for $DATE"
